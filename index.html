<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Live Formula 1 standings and updates from the pit wall." />
    <meta name="theme-color" content="#d9d3dc" />

    <!-- Choose the theme before first paint — the saved choice, otherwise the
         system's — so the page never flashes the wrong one. Inline and
         dependency-free because it has to run ahead of the app bundle. -->
    <script>
      ;(function () {
        var theme
        try {
          var stored = localStorage.getItem('theme')
          theme =
            stored === 'dark' || stored === 'light'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
        } catch (error) {
          theme = 'light'
        }
        document.documentElement.dataset.theme = theme
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0d0c0a' : '#d9d3dc')
      })()
    </script>

    <!-- Link previews (Open Graph + Twitter). og:url and og:image must be absolute
         URLs, so they are pinned to the production origin. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Box this Lap!" />
    <meta property="og:title" content="Box this Lap!" />
    <meta property="og:description" content="Live Formula 1 standings and updates from the pit wall." />
    <meta property="og:url" content="https://boxthislap.vercel.app/" />
    <meta property="og:image" content="https://boxthislap.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Box this Lap! — a headset-wearing pit-wall operator above the tagline" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Box this Lap!" />
    <meta name="twitter:description" content="Live standings and updates from the pit wall." />
    <meta name="twitter:image" content="https://boxthislap.vercel.app/og-image.png" />
    <title>Box this Lap!</title>
    <!-- Loaded with the document rather than after the CSS, since the stylesheet
         references it immediately. Same-origin, but fonts are always CORS. -->
    <link
      rel="preload"
      href="/fonts/archivo-latin-wdth-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- The italic face sets every first-level title, including the brand and
         the hero above the fold, so it is worth preloading alongside the roman. -->
    <link
      rel="preload"
      href="/fonts/archivo-latin-wdth-italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
